<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="oceanBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0c2d3a"/>
      <stop offset="60%" stop-color="#06151c"/>
      <stop offset="100%" stop-color="#02080b"/>
    </radialGradient>

    <!-- Island Stone Gradient -->
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Water Stream Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Garden Moss Gradient -->
    <linearGradient id="mossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="waterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="stoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="108" fill="url(#oceanBg)"/>

  <!-- Water Ripples / Stream Waves -->
  <path d="M 40 180 C 120 150, 200 210, 280 180 C 360 150, 420 200, 480 170" 
        fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
  <path d="M 30 340 C 130 310, 210 370, 290 340 C 370 310, 430 360, 490 330" 
        fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.25" stroke-linecap="round"/>

  <!-- Ocean Stream Grid Cells -->
  <rect x="76" y="76" width="100" height="100" rx="18" fill="url(#waterGrad)" filter="url(#waterGlow)" opacity="0.85"/>
  <rect x="196" y="76" width="100" height="100" rx="18" fill="url(#waterGrad)" filter="url(#waterGlow)" opacity="0.85"/>
  <rect x="76" y="196" width="100" height="100" rx="18" fill="url(#waterGrad)" filter="url(#waterGlow)" opacity="0.85"/>

  <!-- The Main Garden Island (Stepping Stone) -->
  <rect x="196" y="196" width="220" height="220" rx="36" fill="url(#stoneGrad)" filter="url(#stoneShadow)"/>

  <!-- Moss Island Accent Border -->
  <rect x="210" y="210" width="192" height="192" rx="26" fill="none" stroke="url(#mossGrad)" stroke-width="5" opacity="0.7"/>

  <!-- Inner Clue Number "3" -->
  <text x="306" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="110" font-weight="900" fill="#0f172a" text-anchor="middle" dominant-baseline="central">3</text>

  <!-- Small Satellite Island -->
  <rect x="336" y="76" width="80" height="80" rx="18" fill="url(#stoneGrad)" filter="url(#stoneShadow)"/>
  <text x="376" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" font-weight="900" fill="#0f172a" text-anchor="middle" dominant-baseline="central">1</text>

  <!-- Stream Water Connection Path -->
  <rect x="76" y="316" width="100" height="100" rx="18" fill="url(#waterGrad)" filter="url(#waterGlow)" opacity="0.85"/>

  <!-- Floating Water Droplets & Caustics -->
  <circle cx="126" cy="126" r="6" fill="#7dd3fc" opacity="0.8"/>
  <circle cx="126" cy="366" r="5" fill="#7dd3fc" opacity="0.7"/>
  <circle cx="246" cy="126" r="7" fill="#7dd3fc" opacity="0.85"/>

  <!-- Golden Ripple Sparkles -->
  <circle cx="430" cy="190" r="4" fill="url(#goldAccent)"/>
  <circle cx="180" cy="430" r="3.5" fill="url(#goldAccent)"/>
  <circle cx="430" cy="430" r="4.5" fill="url(#goldAccent)"/>
</svg>
