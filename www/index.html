<!DOCTYPE html>
<!-- ZenNurikabe: Calm Japanese Nurikabe Logic Puzzle -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ZenNurikabe - Island Logic Puzzle</title>
  <meta name="description" content="Calm, meditative Japanese Nurikabe grid logic puzzle with soothing procedural water acoustics.">
  <meta name="theme-color" content="#06151c">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="brand">
        <span class="brand-icon">🌊</span>
        <h1 class="brand-title">ZenNurikabe</h1>
      </div>
      <div class="header-controls">
        <button id="btn-sound" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">🔊</button>
        <button id="btn-levels" class="icon-btn" title="Select Level" aria-label="Select Level">☰</button>
      </div>
    </header>

    <!-- Level Bar -->
    <div class="level-bar">
      <div class="level-meta">
        <span id="pack-name" class="pack-name">Spring Garden</span>
        <span id="level-name" class="level-name">Level 1 (5×5)</span>
      </div>
      <div class="level-nav">
        <button id="btn-prev-level" class="nav-btn" title="Previous Level" aria-label="Previous Level">◀</button>
        <button id="btn-next-level" class="nav-btn" title="Next Level" aria-label="Next Level">▶</button>
      </div>
    </div>

    <!-- Hint Banner -->
    <div id="hint-banner" class="hint-banner hidden">
      <span id="hint-text"></span>
      <button id="btn-close-hint" class="hint-close" title="Close" aria-label="Close">✕</button>
    </div>

    <!-- Board Wrapper -->
    <main class="board-container">
      <div id="board-grid" class="board-grid"></div>
    </main>

    <!-- Action Controls -->
    <div class="action-controls">
      <button id="btn-undo" class="action-btn" title="Undo Move">
        <span>⤺</span>
        <span>Undo</span>
      </button>
      <button id="btn-reset" class="action-btn" title="Reset Level">
        <span>↺</span>
        <span>Reset</span>
      </button>
      <button id="btn-hint" class="action-btn" title="Get Hint">
        <span>💡</span>
        <span>Hint</span>
      </button>
      <button id="btn-autowater" class="action-btn active" title="Toggle Auto-Water Surrounding">
        <span>🌊</span>
        <span>Auto-Water</span>
      </button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <span>100% Offline • No Ads</span>
    <span>ZenNurikabe v1.0.0</span>
  </footer>

  <!-- Level Selection Modal -->
  <div id="modal-levels" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Select Level</h2>
        <button id="btn-close-levels" class="icon-btn">✕</button>
      </div>
      <div id="pack-container" class="pack-container"></div>
    </div>
  </div>

  <!-- Victory Modal -->
  <div id="modal-victory" class="modal-overlay hidden">
    <div class="modal-content victory-card">
      <div class="victory-icon">🏝️✨</div>
      <h2 class="victory-title">Garden Flow Harmonized!</h2>
      <p id="victory-msg" class="victory-msg">All garden islands rest peacefully surrounded by the continuous, unbroken ocean stream.</p>
      <button id="btn-next-victory" class="primary-btn">Next Garden ▶</button>
    </div>
  </div>

  <!-- Game Scripts -->
  <script src="levels.js"></script>
  <script src="nurikabe-engine.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
